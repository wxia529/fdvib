name: Release Linux package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          package="fdvib-${version}-linux-x86_64"

          mkdir -p "dist/$package/bin" "dist/$package/share/doc/fdvib/reference" \
                   "dist/$package/share/fdvib/examples"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$package/bin/fdvib" ./cmd/fdvib

          reported_version="$(dist/$package/bin/fdvib --version)"
          if [[ "$reported_version" != "fdvib $version" ]]; then
            echo "Version $version does not match $reported_version" >&2
            exit 1
          fi

          install -m 644 README.md CHANGELOG.md LICENSE \
            "dist/$package/share/doc/fdvib/"
          cp -r docs/. "dist/$package/share/doc/fdvib/reference/"
          cp -r examples/. "dist/$package/share/fdvib/examples/"

          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")

          echo "archive=dist/$package.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$package.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --verify-tag \
            --generate-notes \
            --title "FDVIB ${{ steps.package.outputs.version }}"
